spring:
  application:
    name: Infofys-Intern_project
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:procurement_db}?createDatabaseIfNotExist=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
jwt:
  base64key: ${JWT_SECRET}
  expiration: 172800000 # 2days

server:
  port: ${SERVER_PORT:8080}

seed:
  admin:
    email: ${SEED_ADMIN_EMAIL}
    password: ${SEED_ADMIN_PASSWORD}
  user:
    email: ${SEED_USER_EMAIL}
    password: ${SEED_USER_PASSWORD}
  supplier:
    password: ${SEED_SUPPLIER_PASSWORD}
    techsource-email: ${SEED_SUPPLIER_TECHSOURCE_EMAIL}
    ergocomfort-email: ${SEED_SUPPLIER_ERGOCOMFORT_EMAIL}
    officedepot-email: ${SEED_SUPPLIER_OFFICEDEPOT_EMAIL}
    cloudtech-email: ${SEED_SUPPLIER_CLOUDTECH_EMAIL}

